# Local development only. Kubernetes desired state belongs to infrastructure/gitops.
x-runtime: &runtime
  DB_HOST: db
  DB_PORT: "26257"
  DB_NAME: jagawargadb
  DB_USER: root
  DB_SSL: "false"
  DATABASE_URL: ecto://root@db:26257/jagawargadb
  NATS_URL: nats://mb:4222
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:?Set DEMO_LOGIN_PASSWORD in .env}
  ERL_FLAGS: "+S 2:2"

services:
  db:
    image: cockroachdb/cockroach:v24.3.15
    entrypoint: [/cockroach/cockroach]
    command: [start-single-node, --insecure, --store=/cockroach/cockroach-data, --cache=128MiB, --max-sql-memory=128MiB]
    volumes: [db-data:/cockroach/cockroach-data]
    healthcheck:
      test: [CMD, /cockroach/cockroach, sql, --insecure, -e, SELECT 1]
      interval: 5s
      timeout: 5s
      retries: 30
  schema-init:
    image: cockroachdb/cockroach:v24.3.15
    entrypoint: [/bin/sh, -ec]
    command: ["/cockroach/cockroach sql --insecure --host=db < /schema/init.sql && /cockroach/cockroach sql --insecure --host=db < /schema/seed.sql"]
    volumes: [./src/infras/db:/schema:ro]
    depends_on:
      db: {condition: service_healthy}
  mb:
    image: nats:2.11.3-alpine
    command: [-js, -sd, /data, -m, "8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8222/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    image: traefik:v3.4.1
    ports: ["127.0.0.1:8000:80"]
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.dashboard=false
    volumes: [./src/infras/gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro]
    depends_on: [frontend, identity-service, anonymizer-service, report-service]
  frontend:
    build: {context: ./src/frontend}
    environment: {NODE_ENV: production, PORT: "5000", HOSTNAME: 0.0.0.0}
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  identity-service:
    build: {context: ., dockerfile: src/services/identity/Dockerfile}
    environment: *runtime
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      schema-init: {condition: service_completed_successfully}
      mb: {condition: service_healthy}
  anonymizer-service:
    build: {context: ., dockerfile: src/services/anonymizer/Dockerfile}
    environment: *runtime
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      report-service: {condition: service_started}
      mb: {condition: service_healthy}
  report-migrate:
    build: {context: ./src/services/report}
    environment: *runtime
    command: [/app/bin/report, eval, Report.Release.migrate()]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      schema-init: {condition: service_completed_successfully}
  report-service:
    build: {context: ./src/services/report}
    environment: *runtime
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      report-migrate: {condition: service_completed_successfully}
      mb: {condition: service_healthy}

volumes:
  db-data:
  nats-data:
